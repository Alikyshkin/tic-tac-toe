<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4efe5">
    <meta name="description" content="Крестики-нолики для двух игроков или игры с компьютером.">
    <title>Крестики-нолики</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="layout">
        <header class="intro">
            <h1>Крестики<span>-нолики</span></h1>
            <p>Соберите три знака в ряд.</p>
            <fieldset class="mode" id="game-mode">
                <legend>Соперник</legend>
                <label><input type="radio" name="mode" value="player" checked><span>Друг</span></label>
                <label><input type="radio" name="mode" value="ai"><span>Компьютер</span></label>
            </fieldset>
        </header>
        <section class="game" aria-label="Партия">
            <div class="game__header">
                <p id="game-status" role="status"></p>
                <button id="restartButton" type="button">Заново</button>
            </div>
            <div id="game" class="board" role="group" aria-label="Игровое поле">
                <button type="button" class="cell" data-cell></button>
                <button type="button" class="cell" data-cell></button>
                <button type="button" class="cell" data-cell></button>
                <button type="button" class="cell" data-cell></button>
                <button type="button" class="cell" data-cell></button>
                <button type="button" class="cell" data-cell></button>
                <button type="button" class="cell" data-cell></button>
                <button type="button" class="cell" data-cell></button>
                <button type="button" class="cell" data-cell></button>
            </div>
        </section>
    </main>
</body>
</html>
